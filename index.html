<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All the Fishes</title>
</head>
<body>
<script type = module>

//All of our Pixi code

//Import Pixi
import {
    Application,
    Sprite,
    Assets,
    Container,
    Graphics,
    Text
} from './js/pixi.js';

//Fish button
class Button extends Container {

    //Constructor
    constructor(label,w,h) {
        super(); 

        //Build the button
        this.l = label;
        this.w = w;
        this.h = h;
        this.c = 0x00aaff;

        //Make it listen to events
        this.eventMode = 'static';

        //Draw the button
        this.draw();

        //Add hover state
        this.on('pointerover', (e) => {
            this.cursor = "pointer";
            this.alpha = .5;
        });
        this.on('pointerout', (e) => {
            this.cursor = "pointer";
            this.alpha = .5;
        });
        this.on('mouseout', (e) => {
            this.cursor = "auto";
            this.alpha = 1;
        });

    }
    //Actually set up the button
    draw() {
    this.body = new Graphics()
                .rect(0,0, this.w, this.h)
                .fill(this.c)
                .stroke({ width: 2, color: 0x000000 });
    this.addChild(this.body);

    //Draw the label
    this.label = new Text({
        text: this.l,
        anchor: 0.5
    });
    this.label.x = this.w/2
    this.label.y = this.h/2
    this.addChild(this.label);
    }

}

//Create new app
const app = new Application();

//Initialize the app
await app.init({
    width:640,
    height:480,
    background:0x1099bb //#1099bb
});
document.body.appendChild(app.canvas);

//Load in the fish
const texture = await Assets.load("img/fish.png");
const texture2 = await Assets.load("img/coral1.png");
const texture3 = await Assets.load("img/coral2.webp");
const texture4 = await Assets.load("img/oceanwater.png");

//Create new sprite from fish
const oceansprite = new Sprite(texture4);
    oceansprite.scale.set(1.5, 1.5);
    oceansprite.x = 0;
    oceansprite.y = 0;
    oceansprite.angle = 0;
    oceansprite.anchor.set(0.40,.5);

const coralsprite1 = new Sprite(texture2);
    coralsprite1.scale.set(0.1, 0.2);
    coralsprite1.x = 0;
    coralsprite1.y = 0;
    coralsprite1.angle = 0;
    coralsprite1.anchor.set(0.40,.5);

const coralsprite2 = new Sprite(texture3);
    coralsprite2.scale.set(0.2);
    coralsprite2.x = 0;
    coralsprite2.y = 0;
    coralsprite2.angle = 0;
    coralsprite2.anchor.set(0.40,.5);

const fishsprite1= new Sprite(texture);
    fishsprite1.scale.set(0.05, 0.3);
    fishsprite1.x = 0;
    fishsprite1.y = 0;
    fishsprite1.angle = 0;
    fishsprite1.anchor.set(0.15,.5);

const fishsprite2 = new Sprite(texture);
    fishsprite2.scale.set(0.2);
    fishsprite2.x = 0;
    fishsprite2.y = 0;
    fishsprite2.angle = 0;
    fishsprite2.anchor.set(0.15,.5);

const fishsprite3 = new Sprite(texture);
    fishsprite3.scale.set(0.2);
    fishsprite3.x = 0;
    fishsprite3.y = 0;
    fishsprite3.angle = 0;
    fishsprite3.anchor.set(0.15,.5);


//Create fish container
const ocean = new Container();
    ocean.x = 0;
    ocean.y = 0;

const coral1 = new Container();
    coral1.x = 200;
    coral1.y = 400;

const coral2 = new Container();
    coral2.x = 450;
    coral2.y = 400;

const fish1 = new Container();
    fish1.x = 100;
    fish1.y = 210;

const fish2 = new Container();
    fish2.x = 155;
    fish2.y = 300;

const fish3 = new Container();
    fish3.x = 180;
    fish3.y = 100;

fishsprite1.eventMode = 'static';

let draggingFish = false;
let fishOffsetX = 0;
let fishOffsetY = 0;

fishsprite1.on('pointerdown', (e) => {
    draggingFish = true;
    fishOffsetX = e.global.x - fishsprite1.x;
    fishOffsetY = e.global.y - fishsprite1.y;
});

fishsprite1.on('pointerup', (e) => {
    draggingFish = false;
});

fishsprite1.on('globalpointermove', (e) => {
    if (draggingFish) {
        fishsprite1.x = e.global.x - fishOffsetX;
        fishsprite1.y = e.global.y - fishOffsetY;
    }
});

//Color toggle button for fishsprite1
let colorButt = new Button("Change Color", 170, 40);
    colorButt.x = 400;
    colorButt.y = 20;

let fishColors = [0xffffff, 0xff6600, 0x00ff00, 0x0066ff, 0xff00ff];
let colorIndex = 0;

colorButt.on('pointertap', (e) => {
    colorIndex = (colorIndex + 1) % fishColors.length;
    fishsprite1.tint = fishColors[colorIndex];
});

//Add fishsprite to container
ocean.addChild(oceansprite);
coral1.addChild(coralsprite1);
coral2.addChild(coralsprite2);
fish1.addChild(fishsprite1);
fish2.addChild(fishsprite2);
fish3.addChild(fishsprite3);

//Add fish sprite to stage
app.stage.addChild(ocean);
app.stage.addChild(coral1); 
app.stage.addChild(coral2);
app.stage.addChild(fish1);
app.stage.addChild(fish2);
app.stage.addChild(fish3);
app.stage.addChild(colorButt);

//Animation ticker
app.ticker.add( (time) => {

    //Fish bobbing
    if (!draggingFish) {
        fishsprite1.y = (Math.sin (time.lastTime / 600) * 20);
    }
    fishsprite2.y = (Math.sin (time.lastTime / 600) * 40);
    fishsprite3.y = (Math.sin (time.lastTime / 600) * 30);
   

    //Fish flapping
    let flap = .5 + (Math.sin (time.lastTime / 30) * .005) 
    fishsprite1.scale.x = flap;
    fishsprite2.scale.x = flap;
    fishsprite3.scale.x = flap;
    

    //Fish head turn
    let turn = -(Math.cos (time.lastTime / 600) * 5)
    fishsprite1.angle = turn;
    fishsprite2.angle = turn;
    fishsprite3.angle = turn;
    

    //Coral swaying
    let sway = -(Math.cos (time.lastTime / 600) * 5)
    coralsprite1.angle = sway;
    coralsprite2.angle = sway;

});


</script>
</body>
</html>
